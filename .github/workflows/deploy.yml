name: Deploy Robot Arm Site

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run rsync in dry-run mode"
        type: boolean
        default: true
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: robot-arm-production
  cancel-in-progress: false

jobs:
  build:
    name: Prepare Deployable Site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      ready: ${{ steps.release.outputs.current }}
    runs-on: ubuntu-latest
    steps:
      - name: Check release revision
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('current', 'true');
              return;
            }
            const { data } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main',
            });
            const current = data.commit.sha === context.payload.workflow_run.head_sha;
            core.setOutput('current', String(current));
            if (!current) core.notice('Skipping CI bundle for a superseded main revision.');

      - name: Download tested CI bundle
        if: steps.release.outputs.current == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: robot-arm-site-dist
          path: site/dist/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: actions/checkout@v4
        if: steps.release.outputs.current == 'true' && github.event_name == 'workflow_dispatch'

      - name: Install uv
        if: steps.release.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        if: steps.release.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
        run: uv python install 3.11

      - name: Install CAD dependencies
        if: steps.release.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
        run: uv sync --locked

      - name: Generate public metadata
        if: steps.release.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          uv run python scripts/generate_catalog.py
          uv run python scripts/generate_progress_feed.py
          uv run python scripts/export_models.py
          uv run python scripts/publish_web_models.py

      - name: Set up Node
        if: steps.release.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        if: steps.release.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
        working-directory: site
        run: npm ci

      - name: Build static site
        if: steps.release.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
        working-directory: site
        run: npm run build

      - name: Upload deploy bundle
        if: steps.release.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: robot-arm-site-dist
          path: site/dist/
          if-no-files-found: error

  deploy:
    name: Deploy to Helios
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.ready == 'true'
    environment: production
    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: robot-arm-site-dist
          path: site-dist/

      - name: Validate deployment secrets
        run: |
          missing=()
          [ -n "$HELIOS_HOST" ] || missing+=("HELIOS_HOST")
          [ -n "$HELIOS_USER" ] || missing+=("HELIOS_USER")
          [ -n "$HELIOS_SSH_KEY" ] || missing+=("HELIOS_SSH_KEY")
          [ -n "$TS_AUTHKEY" ] || missing+=("TS_AUTHKEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required production secret(s): %s\n' "${missing[*]}" >&2
            printf 'Add them to the production GitHub Environment before rerunning deploy.\n' >&2
            exit 1
          fi

          if printf '%s' "$HELIOS_HOST" | grep -q '[[:space:]]'; then
            printf 'HELIOS_HOST must be a single Tailscale IP or MagicDNS hostname.\n' >&2
            exit 1
          fi

          if printf '%s' "$HELIOS_USER" | grep -q '[[:space:]@:]'; then
            printf 'HELIOS_USER must be only the SSH username, for example: billy\n' >&2
            exit 1
          fi
        env:
          HELIOS_HOST: ${{ secrets.HELIOS_HOST }}
          HELIOS_USER: ${{ secrets.HELIOS_USER }}
          HELIOS_SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ secrets.HELIOS_HOST }}

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HELIOS_SSH_KEY" > ~/.ssh/helios
          chmod 600 ~/.ssh/helios
          ssh-keyscan -H "$HELIOS_HOST" >> ~/.ssh/known_hosts
        env:
          HELIOS_HOST: ${{ secrets.HELIOS_HOST }}
          HELIOS_SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}

      - name: Sync static files
        run: |
          RSYNC_FLAGS="-avz --delete"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            RSYNC_FLAGS="$RSYNC_FLAGS --dry-run"
          fi
          rsync $RSYNC_FLAGS -e "ssh -i ~/.ssh/helios" site-dist/ "$HELIOS_USER@$HELIOS_HOST:/var/www/billybitcoin.cloud/html/robot-arm/"
        env:
          HELIOS_HOST: ${{ secrets.HELIOS_HOST }}
          HELIOS_USER: ${{ secrets.HELIOS_USER }}
